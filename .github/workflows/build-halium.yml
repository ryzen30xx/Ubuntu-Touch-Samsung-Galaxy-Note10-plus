name: Build Halium (Ubuntu Touch) for d2s

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'halium/**'
      - 'sources/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 python3 wget locales
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Run Build Script
        run: ./build.sh

      - name: Upload Halium Boot Image
        uses: actions/upload-artifact@v3
        with:
          name: halium-boot.img
          path: workspace/out/target/product/d2s/halium-boot.img

      - name: Upload System Image
        uses: actions/upload-artifact@v3
        with:
          name: system.img
          path: workspace/out/target/product/d2s/system.img
